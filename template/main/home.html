<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Vote</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --primary: #4f46e5;
            --primary-soft: rgba(79, 70, 229, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f7f8ff 45%, #f3f7fb 100%);
            color: var(--text);
            padding: 32px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 2.5vw, 2.6rem);
        }

        .status {
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 26px;
        }

        .kpi-card {
            background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 10px 25px rgba(31, 41, 55, 0.04);
        }

        .kpi-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .kpi-value {
            font-size: clamp(1.7rem, 2vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0 0 8px;
        }

        .kpi-trend {
            font-size: 0.82rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        .filters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            background: #f9fafc;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-group {
            display: inline-flex;
            background: #eef2ff;
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .filter-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease-in-out;
        }

        .filter-btn.active {
            background: var(--panel);
            color: var(--primary);
            box-shadow: 0 3px 12px rgba(79, 70, 229, 0.12);
        }

        select {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 38px 10px 12px;
            background: white;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            min-width: 170px;
        }

        .chart-card {
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 18px 8px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .chart-header h2 {
            font-size: 1.2rem;
            margin: 0;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            display: inline-block;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b7cff, #6a5ef7);
        }

        #chart-container {
            width: 100%;
            height: 420px;
        }

        @media (max-width: 900px) {
            .kpi-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
        }

        @media (max-width: 600px) {
            .container { padding: 18px; }
            .kpi-grid { grid-template-columns: 1fr; }
            .topbar, .filters, .chart-header { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Real-Time Voting Dashboard</h1>
            <div class="status" id="status">Connecting...</div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">
                    <span>Total votes</span>
                    <span class="badge" style="background: #4f46e5;"></span>
                </div>
                <p class="kpi-value" id="kpi-total">0</p>
                <div class="kpi-trend"><span class="positive">▲ 8.4%</span> vs yesterday</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-label">
                    <span>Top candidate</span>
                    <span class="badge" style="background: #10b981;"></span>
                </div>
                <p class="kpi-value" id="kpi-leader">Candidate 1</p>
                <div class="kpi-trend"><span id="kpi-leader-votes">0</span> votes</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-label">
                    <span>Connection Stats</span>
                    <span class="badge" style="background: #f59e0b;"></span>
                </div>
                <p class="kpi-value" id="kpi-share">0%</p>
                <div class="kpi-trend"><span class="positive">▲ Stable momentum</span></div>
            </div>

            <div class="kpi-card">
                <div class="kpi-label">
                    <span>Participation</span>
                    <span class="badge" style="background: #ef4444;"></span>
                </div>
                <p class="kpi-value" id="kpi-participation">0%</p>
                <div class="kpi-trend"><span class="negative">▼ 1.2%</span> this hour</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="candidate-select" style="font-weight: 600; color: var(--muted);">Candidate:</label>
                <select id="candidate-select">
                    <option value="all">All candidates</option>
                    <option value="candidate_1">Candidate 1</option>
                    <option value="candidate_2">Candidate 2</option>
                    <option value="candidate_3">Candidate 3</option>
                </select>
            </div>

            <div class="filter-group">
                <span style="font-weight: 600; color: var(--muted);">Time range:</span>
                <div class="pill-group">
                    <button class="filter-btn active" data-range="live">Live</button>
                    <button class="filter-btn" data-range="1h">1H</button>
                    <button class="filter-btn" data-range="24h">24H</button>
                    <button class="filter-btn" data-range="7d">7D</button>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <h2>Candidate performance</h2>
                <div class="legend">
                    <span><span class="legend-dot"></span> Live vote count</span>
                </div>
            </div>

            <div id="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const liveVotes = {};

        function formatLabel(key) {
            return String(key)
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function getCandidateEntries() {
            return Object.entries(liveVotes).sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0));
        }

        function getChartPalette(count) {
            const palette = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'];
            return Array.from({ length: count }, (_, index) => palette[index % palette.length]);
        }

        function updateCandidateSelector() {
            const selector = document.getElementById('candidate-select');
            const currentValue = selector.value;
            const allEntries = getCandidateEntries();

            selector.innerHTML = '<option value="all">All candidates</option>' +
                allEntries
                    .map(([key]) => `<option value="${key}">${formatLabel(key)}</option>`)
                    .join('');

            if (allEntries.some(([key]) => key === currentValue)) {
                selector.value = currentValue;
            } else {
                selector.value = 'all';
            }
        }

        function updateKPIs() {
            const entries = getCandidateEntries();
            const total = entries.reduce((sum, [, value]) => sum + Number(value || 0), 0);
            const leader = entries.length ? entries[0] : ['candidate_1', 0];
            const leaderName = formatLabel(leader[0]);
            const leaderShare = total ? ((Number(leader[1] || 0) / total) * 100).toFixed(1) : '0.0';
            const participation = total ? Math.min(100, Math.round((total / 300) * 100)).toFixed(0) : '0';

            document.getElementById('kpi-total').textContent = total;
            document.getElementById('kpi-leader').textContent = leaderName;
            document.getElementById('kpi-leader-votes').textContent = Number(leader[1] || 0);
            document.getElementById('kpi-share').textContent = leaderShare + '%';
            document.getElementById('kpi-participation').textContent = participation + '%';
        }

        function applyFilters() {
            const candidateFilter = document.getElementById('candidate-select').value;
            const range = document.querySelector('.filter-btn.active')?.dataset.range || 'live';
            const entries = getCandidateEntries();

            let labels = entries.map(([key]) => formatLabel(key));
            let values = entries.map(([, value]) => Number(value || 0));

            if (candidateFilter !== 'all') {
                const selected = entries.find(([key]) => key === candidateFilter);
                if (selected) {
                    labels = [formatLabel(selected[0])];
                    values = [Number(selected[1] || 0)];
                }
            }

            if (!labels.length) {
                labels = ['No candidate'];
                values = [0];
            }

            dataObj.data.labels = labels;
            dataObj.data.datasets[0].data = values;
            dataObj.data.datasets[0].backgroundColor = getChartPalette(values.length);

            if (range === '1h') {
                dataObj.data.datasets[0].backgroundColor = getChartPalette(values.length).map((color, index) => index % 2 === 0 ? '#4f46e5' : '#7c3aed');
            } else if (range === '24h') {
                dataObj.data.datasets[0].backgroundColor = getChartPalette(values.length).map((color, index) => index % 2 === 0 ? '#10b981' : '#34d399');
            } else if (range === '7d') {
                dataObj.data.datasets[0].backgroundColor = getChartPalette(values.length).map((color, index) => index % 2 === 0 ? '#f59e0b' : '#fbbf24');
            }

            if (window.myLine) {
                window.myLine.update();
            }

            updateKPIs();
        }

        const ctx = document.getElementById('myChart');

        const dataObj = {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Votes',
                    data: [],
                    borderRadius: 10,
                    borderSkipped: false,
                    backgroundColor: ['#4f46e5', '#6366f1', '#8b5cf6'],
                    borderWidth: 1,
                    borderColor: 'rgba(255,255,255,0.8)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 600 },
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { precision: 0 },
                        grid: { color: 'rgba(148, 163, 184, 0.15)' }
                    },
                    x: { grid: { display: false } }
                }
            }
        };

        if (typeof Chart !== 'undefined') {
            window.myLine = new Chart(ctx, dataObj);
        }

        document.getElementById('candidate-select').addEventListener('change', applyFilters);

        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', function () {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                applyFilters();
            });
        });

        const socket = new WebSocket('ws://localhost:8000/ws/votes/');

        socket.onopen = function () {
            console.log('Connection established');
            document.getElementById('status').innerText = '🟢 Connected to voting server';
        };

        socket.onmessage = function (e) {
            console.log('Received:', e.data);

            try {
                const recData = JSON.parse(e.data);
                const incoming = recData && recData.votes ? recData.votes : recData;

                if (incoming && typeof incoming === 'object') {
                    Object.entries(incoming).forEach(([key, value]) => {
                        const numericValue = Number(value);
                        if (!Number.isNaN(numericValue)) {
                            liveVotes[String(key)] = numericValue;
                        }
                    });
                }

                if (recData && recData.candidate) {
                    const candidateKey = String(recData.candidate);
                    liveVotes[candidateKey] = Number(liveVotes[candidateKey] || 0) + 1;
                }

                updateCandidateSelector();
                applyFilters();
                console.log('Updated votes:', liveVotes);
            } catch (error) {
                console.error('Invalid WebSocket payload:', error);
            }
        };

        socket.onclose = function () {
            console.log('Connection Closed');
            document.getElementById('status').innerText = '🔴 Disconnected from voting server';
        };

        socket.onerror = function (error) {
            console.error('WebSocket Error:', error);
            document.getElementById('status').innerText = '⚠️ WebSocket connection error';
        };

        updateCandidateSelector();
        updateKPIs();
        applyFilters();
    </script>
</body>
</html>
